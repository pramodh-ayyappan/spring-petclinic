version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17.0
    container_name: petclinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./petclinic-backend/src/main/resources/db/postgres/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./petclinic-backend/src/main/resources/db/postgres/data.sql:/docker-entrypoint-initdb.d/2-data.sql
    networks:
      - petclinic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic -d petclinic"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL Database (alternative)
  mysql:
    image: mysql:9.1
    container_name: petclinic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: petclinic
      MYSQL_USER: petclinic
      MYSQL_PASSWORD: petclinic
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./petclinic-backend/src/main/resources/db/mysql/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./petclinic-backend/src/main/resources/db/mysql/data.sql:/docker-entrypoint-initdb.d/2-data.sql
    networks:
      - petclinic-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "petclinic", "-ppetclinic"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - mysql

  # Spring Boot Backend
  backend:
    build:
      context: ./petclinic-backend
      dockerfile: Dockerfile
    container_name: petclinic-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/petclinic
      - SPRING_DATASOURCE_USERNAME=petclinic
      - SPRING_DATASOURCE_PASSWORD=petclinic
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SERVER_PORT=8080
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
      # Additional vets file configuration
      - PETCLINIC_ADDITIONAL_VETS_ENABLED=true
      - PETCLINIC_ADDITIONAL_VETS_FILE=/app/data/additional-vets.json
      # Admin credentials (change these for production!)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"
    volumes:
      - ./additional-vets.json:/app/data/additional-vets.json:ro
      - ./exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petclinic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Frontend
  frontend:
    build:
      context: ./petclinic-frontend
      dockerfile: Dockerfile
    container_name: petclinic-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - petclinic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: petclinic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - petclinic-network
    profiles:
      - nginx

volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local

networks:
  petclinic-network:
    driver: bridge 
