# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Internationalization
spring.messages.basename=messages/messages

# Actuator
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

# AWS S3 Configuration
# You can use either access key/secret key OR profile OR default credentials provider chain
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.profile=${AWS_PROFILE:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:petclinic-vets}

# Additional Vets Configuration
# Enable/disable loading additional vets from JSON file
petclinic.additional-vets.enabled=${ADDITIONAL_VETS_ENABLED:true}

# Path to the JSON file containing additional vets
# Supports multiple formats:
#   - Classpath resource: additional-vets.json (default)
#   - Absolute path: /path/to/additional-vets.json
#   - Relative path: ./data/additional-vets.json
#   - File URL: file:/path/to/additional-vets.json
#   - Environment variable: ${ADDITIONAL_VETS_FILE_PATH:additional-vets.json}
petclinic.additional-vets.file-path=${ADDITIONAL_VETS_FILE_PATH:additional-vets.json}

# Export Configuration
# Directory where exported files will be saved
petclinic.export.directory=${EXPORT_DIRECTORY:./exports}

# Admin Authentication Configuration
# Admin credentials for S3 and export functionality
petclinic.admin.username=${ADMIN_USERNAME:admin}
petclinic.admin.password=${ADMIN_PASSWORD:admin123}
